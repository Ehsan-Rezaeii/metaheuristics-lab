[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metaheuristics-lab"
version = "0.1.0"
description = "Readable NumPy metaheuristics with evaluation-budgeted experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ehsan Rezaei"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
